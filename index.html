<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar API · Direktori Pengguna dengan Modal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #171a21;
            --surface: #21252e;
            --surface-2: #2a2f3a;
            --line: #363c49;
            --text: #e9ebef;
            --muted: #8b93a3;
            --accent: #5eead4;
            --accent-hover: #2dd4bf;
            --error: #f87171;
            --overlay: rgba(10, 12, 16, 0.85); 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            &.modal-open { overflow: hidden; } 
        }

        .wrap { max-width: 920px; margin: 0 auto; padding: 48px 24px 80px; }
        header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 28px; margin-bottom: 28px; }
        .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
        .badge { background: rgba(94, 234, 212, 0.15); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 4vw, 38px); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
        h1 span { color: var(--muted); font-weight: 500; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* --- Controls & Enhanced Search Box --- */
        .controls { display: flex; gap: 12px; width: 100%; margin-bottom: 24px; }
        .search-box { flex: 1; position: relative; display: flex; align-items: center; }
        .search-box input { 
            width: 100%; 
            background: var(--surface); 
            border: 1px solid var(--line); 
            border-radius: 8px; 
            padding: 12px 40px 12px 16px; 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.2s ease; 
        }
        .search-box input:focus { border-color: var(--accent); }
        .clear-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            display: none;
            padding: 4px;
            line-height: 1;
        }
        .clear-btn:hover { color: var(--text); }

        button#loadBtn, button.btn-retry, button.btn-primary { 
            font-family: 'Space Grotesk', sans-serif; 
            font-weight: 600; 
            font-size: 15px; 
            color: #10151a; 
            background: var(--accent); 
            border: none; 
            padding: 12px 22px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.15s ease; 
            white-space: nowrap; 
        }
        button#loadBtn:hover, button.btn-retry:hover, button.btn-primary:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px); 
            box-shadow: 0 6px 20px -4px rgba(94,234,212,0.35); 
        }
        button#loadBtn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        
        button.btn-secondary {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line);
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button.btn-secondary:hover { background: var(--line); }

        #hasil { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 20px; border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; }
        .empty.error { border-color: rgba(248, 113, 113, 0.4); color: var(--error); }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
            animation: rise 0.4s ease both;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            border-color: rgba(94, 234, 212, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px -6px rgba(0,0,0,0.3);
        }
        .card::after {
            content: 'Detail ↗';
            position: absolute;
            top: 12px;
            right: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .card:hover::after { opacity: 1; }

        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #10151a; flex-shrink: 0; }
        .name-block .name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.2; }
        .name-block .endpoint { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
        .field { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 72px 1fr; gap: 10px; font-size: 13px; }
        .field .k { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 11px; padding-top: 2px; }
        .field .v { color: var(--text); line-height: 1.5; word-break: break-word; }
        .field .v.muted { color: var(--muted); }

        .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 6px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; height: 180px; display: flex; flex-direction: column; gap: 12px; }

        /* --- Modal Popup --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px -12px rgba(0,0,0,0.5);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.open .modal-content { transform: scale(1) translateY(0); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky; top: 0;
            background: var(--surface);
            z-index: 10;
        }
        .modal-header h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; font-size: 18px; font-weight: 600; }
        .close-modal { background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; transition: color 0.15s ease; }
        .close-modal:hover { color: var(--accent); }
        .modal-body { padding: 24px; }
        .detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
        .detail-hero .avatar { width: 80px; height: 80px; font-size: 28px; margin-bottom: 16px; }
        .detail-hero .name { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 4px; }
        .detail-hero .username { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 14px; }
        .detail-section-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 24px 0 12px; }
        .modal-body .field { grid-template-columns: 100px 1fr; }

        /* --- Styling Form Input Modal --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus { border-color: var(--accent); }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

        @media (prefers-reduced-motion: reduce) {
            .card, .modal-overlay, .modal-content { animation: none; transition: none; transform: none; backdrop-filter: none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <p class="eyebrow">
                    GET /users
                    <span id="userCount" class="badge" style="display: none;">0 Pengguna</span>
                </p>
                <h1>Belajar API <span>· direktori pengguna</span></h1>
            </div>
            <div class="header-actions">
                <button id="addBtn" class="btn-secondary" onclick="openAddModal()" style="display: none;">+ Tambah Anggota</button>
                <button id="loadBtn" onclick="loadData()">Tampilkan Data</button>
            </div>
        </header>

        <!-- Area Kontrol Pencarian -->
        <div class="controls" id="controls" style="display: none;">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nama, email, username, kota, atau perusahaan... (Ctrl+K)" oninput="handleSearchInput()">
                <button id="clearSearchBtn" class="clear-btn" onclick="clearSearch()" title="Hapus pencarian">&times;</button>
            </div>
        </div>

        <div id="hasil" aria-live="polite">
            <p class="empty">Klik "Tampilkan Data" untuk mengambil data dari API.</p>
        </div>
    </div>

    <!-- Modal Detail Profile -->
    <div class="modal-overlay" id="userModal" onclick="closeModalOnOverlay(event, 'userModal')">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle">Profil Detail</h2>
                <button class="close-modal" onclick="closeModal('userModal')" aria-label="Tutup modal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Data Dinamis -->
            </div>
        </div>
    </div>

    <!-- Modal Form Tambah Anggota -->
    <div class="modal-overlay" id="addModal" onclick="closeModalOnOverlay(event, 'addModal')">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
            <div class="modal-header">
                <h2 id="addModalTitle">Tambah Anggota Baru</h2>
                <button class="close-modal" onclick="closeModal('addModal')" aria-label="Tutup modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addUserForm" onsubmit="handleAddUser(event)">
                    <div class="form-group">
                        <label for="addName">NAMA LENGKAP *</label>
                        <input type="text" id="addName" required placeholder="Contoh: Budi Santoso">
                    </div>
                    <div class="form-group">
                        <label for="addUsername">USERNAME *</label>
                        <input type="text" id="addUsername" required placeholder="Contoh: budisantoso">
                    </div>
                    <div class="form-group">
                        <label for="addEmail">EMAIL *</label>
                        <input type="email" id="addEmail" required placeholder="Contoh: budi@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="addPhone">TELEPON</label>
                        <input type="text" id="addPhone" placeholder="Contoh: 0812-3456-7890">
                    </div>
                    <div class="form-group">
                        <label for="addCity">KOTA *</label>
                        <input type="text" id="addCity" required placeholder="Contoh: Jakarta">
                    </div>
                    <div class="form-group">
                        <label for="addCompany">PERUSAHAAN</label>
                        <input type="text" id="addCompany" placeholder="Contoh: PT Technology Jaya">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="closeModal('addModal')">Batal</button>
                        <button type="submit" class="btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const ACCENTS = ["#5eead4", "#f0abfc", "#fca5a5", "#fcd34d", "#93c5fd", "#a5b4fc"];
        let rawUsersData = []; 
        let searchDebounceTimeout = null;

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
        }

        function initials(name) { return name ? name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase() : "??"; }
        function colorFor(id) { return ACCENTS[id % ACCENTS.length]; }

        function showSkeleton() {
            const hasil = document.getElementById("hasil");
            hasil.innerHTML = Array(6).fill(0).map(() => `
                <div class="skeleton-card">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div class="skeleton" style="width:44px; height:44px; border-radius:50%;"></div>
                        <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                            <div class="skeleton" style="height:16px; width:60%;"></div>
                            <div class="skeleton" style="height:12px; width:40%;"></div>
                        </div>
                    </div>
                    <div class="skeleton" style="height:14px; width:100%; margin-top:auto;"></div>
                    <div class="skeleton" style="height:14px; width:80%;"></div>
                </div>
            `).join("");
        }

        async function loadData() {
            const btn = document.getElementById("loadBtn");
            const addBtn = document.getElementById("addBtn");
            const hasil = document.getElementById("hasil");
            const controls = document.getElementById("controls");

            btn.disabled = true;
            btn.textContent = "Memuat...";
            showSkeleton();

            try {
                const response = await fetch("http://localhost/api/data_json.php");
                if (!response.ok) throw new Error("Gagal terhubung ke server");

                rawUsersData = await response.json();
                
                controls.style.display = "flex";
                addBtn.style.display = "inline-block";
                
                // Render data awal & update counter
                filterData();
            } catch (err) {
                controls.style.display = "none";
                addBtn.style.display = "none";
                updateUserBadge(0, false);
                hasil.innerHTML = `
                    <div class="empty error">
                        <p style="margin:0 0 12px; font-weight:500;">Gagal memuat data dari server.</p>
                        <button class="btn-retry" onclick="loadData()">Coba Lagi</button>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = "Muat Ulang Data";
            }
        }

        function renderCards(users) {
            const hasil = document.getElementById("hasil");

            if (users.length === 0) {
                hasil.innerHTML = `<p class="empty">Tidak ada pengguna yang cocok dengan pencarian.</p>`;
                return;
            }

            hasil.innerHTML = users.map(item => {
                const safeName = escapeHTML(item.name);
                const safeEmail = escapeHTML(item.email);
                const safeCity = escapeHTML(item.address?.city || '-');

                return `
                <div class="card" onclick="openModal(${item.id})" title="Klik untuk detail ${safeName}">
                    <div class="card-head">
                        <div class="avatar" style="background:${colorFor(item.id)}">${initials(safeName)}</div>
                        <div class="name-block">
                            <div class="name">${safeName}</div>
                            <div class="endpoint">/users/${item.id}</div>
                        </div>
                    </div>
                    <div class="field">
                        <span class="k">EMAIL</span>
                        <span class="v">${safeEmail}</span>
                    </div>
                    <div class="field">
                        <span class="k">KOTA</span>
                        <span class="v muted">${safeCity}</span>
                    </div>
                </div>
                `;
            }).join("");
        }

        /* --- Logika Pencarian --- */
        function handleSearchInput() {
            const clearBtn = document.getElementById("clearSearchBtn");
            const query = document.getElementById("searchInput").value;
            
            clearBtn.style.display = query.trim().length > 0 ? "block" : "none";

            clearTimeout(searchDebounceTimeout);
            searchDebounceTimeout = setTimeout(() => {
                filterData();
            }, 200);
        }

        function filterData() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            
            const filtered = rawUsersData.filter(user => 
                (user.name && user.name.toLowerCase().includes(query)) ||
                (user.username && user.username.toLowerCase().includes(query)) ||
                (user.email && user.email.toLowerCase().includes(query)) ||
                (user.address?.city && user.address.city.toLowerCase().includes(query)) ||
                (user.company?.name && user.company.name.toLowerCase().includes(query))
            );

            renderCards(filtered);
            updateUserBadge(filtered.length, true, query.length > 0);
        }

        function clearSearch() {
            const searchInput = document.getElementById("searchInput");
            searchInput.value = "";
            handleSearchInput();
            searchInput.focus();
        }

        function updateUserBadge(count, visible = true, isFiltered = false) {
            const countBadge = document.getElementById("userCount");
            if (!visible) {
                countBadge.style.display = "none";
                return;
            }
            countBadge.style.display = "inline-block";
            countBadge.textContent = isFiltered ? `${count} Ditemukan` : `${count} Pengguna`;
        }

        /* --- Modal Logic General --- */
        function openModal(userId) {
            const user = rawUsersData.find(u => u.id === userId);
            if (!user) return;

            const modalBody = document.getElementById("modalBody");

            const safe = {
                name: escapeHTML(user.name),
                username: escapeHTML(user.username),
                email: escapeHTML(user.email),
                phone: escapeHTML(user.phone || '-'),
                website: escapeHTML(user.website || '-'),
                street: escapeHTML(user.address?.street || '-'),
                suite: escapeHTML(user.address?.suite || ''),
                city: escapeHTML(user.address?.city || '-'),
                zip: escapeHTML(user.address?.zipcode || '-'),
                company: escapeHTML(user.company?.name || '-'),
                catchPhrase: escapeHTML(user.company?.catchPhrase || '-')
            };

            modalBody.innerHTML = `
                <div class="detail-hero">
                    <div class="avatar" style="background:${colorFor(user.id)}">${initials(safe.name)}</div>
                    <h3 class="name">${safe.name}</h3>
                    <div class="username">@${safe.username}</div>
                </div>

                <div class="detail-section-title">Kontak</div>
                <div class="field"><span class="k">EMAIL</span><span class="v">${safe.email}</span></div>
                <div class="field"><span class="k">TELEPON</span><span class="v">${safe.phone}</span></div>
                <div class="field"><span class="k">WEBSITE</span><span class="v">${safe.website}</span></div>

                <div class="detail-section-title">Alamat</div>
                <div class="field">
                    <span class="k">LOKASI</span>
                    <span class="v muted">${safe.street} ${safe.suite}<br>${safe.city}, ${safe.zip}</span>
                </div>

                <div class="detail-section-title">Perusahaan</div>
                <div class="field"><span class="k">NAMA</span><span class="v">${safe.company}</span></div>
                <div class="field"><span class="k">SLOGAN</span><span class="v muted"><em>"${safe.catchPhrase}"</em></span></div>
            `;

            const modal = document.getElementById("userModal");
            modal.classList.add("open");
            document.body.classList.add("modal-open");
        }

        function openAddModal() {
            document.getElementById("addUserForm").reset();
            const modal = document.getElementById("addModal");
            modal.classList.add("open");
            document.body.classList.add("modal-open");
            setTimeout(() => document.getElementById("addName").focus(), 100);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove("open");
                document.body.classList.remove("modal-open");
            }
        }

        function closeModalOnOverlay(event, modalId) {
            if (event.target === document.getElementById(modalId)) {
                closeModal(modalId);
            }
        }

        /* --- Logika Tambah Anggota Baru --- */
        /* --- Logika Tambah Anggota Baru Ke MySQL --- */
async function handleAddUser(event) {
    event.preventDefault();

    const submitBtn = event.target.querySelector('button[type="submit"]');
    const originalBtnText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Menyimpan...";

    // Context payload yang dikirim ke backend PHP
    const payload = {
        name: document.getElementById("addName").value,
        username: document.getElementById("addUsername").value,
        email: document.getElementById("addEmail").value,
        phone: document.getElementById("addPhone").value || "-",
        city: document.getElementById("addCity").value,
        company: document.getElementById("addCompany").value || "-"
    };

    try {
        const response = await fetch("http://localhost/api/data_json.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || result.status === "error") {
            throw new Error(result.message || "Gagal menyimpan data.");
        }

        alert("Data berhasil disimpan ke database MySQL!");
        
        // Masukkan data balikan dari MySQL ke array lokal & perbarui UI
        rawUsersData.unshift(result.data);
        filterData();
        closeModal("addModal");

    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
    }
}

        /* --- Event Listeners Global --- */
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal("userModal");
                closeModal("addModal");
            }
            
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
                const searchInput = document.getElementById("searchInput");
                if (searchInput && document.getElementById("controls").style.display !== "none") {
                    event.preventDefault();
                    searchInput.focus();
                }
            }
        });
    </script>
</body>
</html>
