<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Tugas - Todos API</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:1100px;
    background:#fff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:10px;
}

p.deskripsi{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

button{
    display:block;
    margin:auto;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
}

#status{
    margin:20px 0;
    text-align:center;
    font-weight:bold;
    color:#444;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:10px;
}

th{
    background:#007bff;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8f9fa;
}

tr:hover{
    background:#d9ecff;
    transition:.3s;
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:13px;
    font-weight:bold;
}

.selesai{
    background:#28a745;
}

.belum{
    background:#dc3545;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<h2>📋 Daftar Tugas (Todos API)</h2>

<p class="deskripsi">
Menampilkan data dari JSONPlaceholder menggunakan Fetch API.
</p>

<button onclick="loadTodos()">
📥 Tampilkan Daftar Tugas
</button>

<p id="status"></p>

<table id="tabelTodos" style="display:none;">
<thead>
<tr>
<th>No</th>
<th>Judul Tugas</th>
<th>Status</th>
</tr>
</thead>

<tbody id="isiTabelTodos">

</tbody>
</table>

<div class="footer">
SMK RPL • Praktikum Fetch API
</div>

</div>

<script>

function loadTodos(){

const statusEl=document.getElementById("status");
const tabel=document.getElementById("tabelTodos");
const isi=document.getElementById("isiTabelTodos");

statusEl.style.color="#444";
statusEl.innerHTML="⏳ Sedang mengambil data...";
isi.innerHTML="";
tabel.style.display="none";

fetch("https://jsonplaceholder.typicode.com/todos")

.then(response=>{

if(!response.ok){
throw new Error("Status : "+response.status);
}

return response.json();

})

.then(data=>{

statusEl.innerHTML="✅ Berhasil mengambil <b>"+data.length+"</b> data.";

let html="";

data.forEach((item,index)=>{

let badge=item.completed
?
'<span class="badge selesai">✔ Selesai</span>'
:
'<span class="badge belum">✖ Belum</span>';

html+=`
<tr>
<td>${index+1}</td>
<td>${item.title}</td>
<td>${badge}</td>
</tr>
`;

});

isi.innerHTML=html;

tabel.style.display="table";

})

.catch(error=>{

statusEl.style.color="red";
statusEl.innerHTML="❌ "+error.message;

});

}

</script>

</body>
</html>
